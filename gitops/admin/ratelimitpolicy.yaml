apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: api-route-rl-admin
  namespace: atp-admin
  labels:
    workshop.user: admin
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: api-route-admin
  limits:
    "per-user-per-minute":
      rates:
        - limit: 5
          window: 60s
      counters:
        - expression: auth.identity.user_id
